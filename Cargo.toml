[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-3-Clause"

[workspace.dependencies]
emuvc-usb = { path = "crates/emuvc-usb" }
emuvc-uvc = { path = "crates/emuvc-uvc" }
emuvc-video = { path = "crates/emuvc-video" }
emuvc-devices = { path = "crates/emuvc-devices" }
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Frame generation/encoding is painfully slow unoptimised; keep debug builds usable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.emuvc-video]
opt-level = 3
