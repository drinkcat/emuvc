# Status interrupt packets at the edges of UVC 1.5 2.4.2.2 (tables 2-1 to 2-3) on the synthetic
# camera: malformed or reserved packets first, then one of each well-formed control change
# (value, failure, min, max) and a button press/release. The host must drop the first group
# without crashing and still deliver the second.
[[device]]
model = "synthetic"

# ---- malformed / reserved (at 0 ms, queued before the host reads the endpoint) ----
[[device.event]]
kind = { raw = [] }                      # zero-length packet
[[device.event]]
kind = { raw = [1] }                     # bStatusType only
[[device.event]]
kind = { raw = [1, 3, 0, 2] }            # VC, no bAttribute
[[device.event]]
kind = { raw = [2, 1, 0] }               # VS button press without bValue
[[device.event]]
kind = { raw = [0, 3, 0, 2, 0, 5, 0] }   # originator 0 (reserved)
[[device.event]]
kind = { raw = [3, 3, 0, 2, 0, 5, 0] }   # originator 3 (reserved)
[[device.event]]
kind = { raw = [1, 0, 0, 2, 0, 5, 0] }   # bOriginator 0: the VideoControl interface itself
[[device.event]]
kind = { raw = [1, 0xee, 0, 2, 0, 5, 0] } # unknown entity
[[device.event]]
kind = { raw = [1, 3, 1, 2, 0, 5, 0] }   # reserved bEvent
[[device.event]]
kind = { raw = [1, 3, 0, 2, 9, 5, 0] }   # reserved bAttribute
[[device.event]]
kind = { raw = [2, 1, 1, 0] }            # VS stream error event

# ---- well-formed (entity 3: processing unit, selector 2: brightness) ----
[[device.event]]
at_ms = 300
kind = { control = { entity = 3, selector = 0x02, value = [7, 0] } }
[[device.event]]
at_ms = 300
kind = { control = { entity = 3, selector = 0x02, attribute = 2, value = [0x02] } }
[[device.event]]
at_ms = 300
kind = { control = { entity = 3, selector = 0x02, attribute = 3, value = [0xc0, 0xff] } }
[[device.event]]
at_ms = 300
kind = { control = { entity = 3, selector = 0x02, attribute = 4, value = [0x40, 0] } }
[[device.event]]
at_ms = 300
kind = "button"
