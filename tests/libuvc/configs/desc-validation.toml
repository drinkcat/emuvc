synthetic = { product_id = 0x0112 }
[[device.patch]]
target = { iface = "vs", subtype = 0x11 }
truncate = 33
set = [[21, 0]]

# 0113 frame-based-frame-intervals-over: frame-based frame bFrameIntervalType 9: the interval list overruns bLength
