# Bulk streaming with transfer errors libuvc retries (timeout, babble) and
# corrupted payload headers.
seed = 7
[[device]]
model = "synthetic"
synthetic = { transfer = "bulk" }
[[device.fault]]
on = { data_in = { ep = 0x81 } }
action = { error = "timeout" }
probability = 0.03
[[device.fault]]
on = { data_in = { ep = 0x81 } }
action = { error = "overflow" }
probability = 0.03
[[device.fault]]
on = { data_in = { ep = 0x81 } }
action = { corrupt = { offset = 0, xor = 0xff } }
probability = 0.03
