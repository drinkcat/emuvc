[package]
name = "emuvc-libusb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LD_PRELOAD-able libusb-1.0 replacement backed by emuvc's emulated devices"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
emuvc-devices = { version = "0.1.0", path = "../emuvc-devices" }
emuvc-usb = { version = "0.1.0", path = "../emuvc-usb" }
env_logger = "0.11.11"
libc = "0.2"
log.workspace = true
